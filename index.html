<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Correio Elegante Digital</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>💌 Correio Elegante</h1>
        <p>Envie sua mensagem! A organização vai ler (ou entregar) na festa.</p>

        <div class="form-group">
            <label for="para">Para quem é?</label>
            <input type="text" id="para" placeholder="Nome da pessoa">
        </div>

        <div class="form-group">
            <label for="turma">De qual turma ela é?</label>
            <input type="text" id="turma" placeholder="Ex: 2º Ano B">
        </div>

        <div class="form-group">
            <label for="mensagem">Sua Mensagem (Pode ser anônima!)</label>
            <textarea id="mensagem" rows="4" placeholder="Escreva aqui seu correio elegante..."></textarea>
        </div>

        <button onclick="enviarCorreio()">Enviar Correio 💘</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
